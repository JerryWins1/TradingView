name: Weekly check-in

on:
  schedule:
    - cron: "17 12 * * 1"  # Mondays, about 8am U.S. Eastern
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m steward fetch
      - run: python -m steward report --out reports/latest.md
      - name: Open the check-in as an issue (GitHub emails it to you)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Steward weekly check-in $(date +%Y-%m-%d)" --body-file reports/latest.md
