# Steward rules. Every number the system acts on lives here, so the plan
# can be read, questioned and changed without touching code.

[account]
starting_capital = 25000
mode = "paper"            # "paper" only. Real money is a later, deliberate step.

[universe]
us_equity = "SPY"         # S&P 500
intl_equity = "EFA"       # Developed markets outside the U.S.
bonds = "AGG"             # U.S. investment-grade bonds
equities = ["SPY", "EFA"] # What the economic-regime cap applies to

[strategy]
trend_months = 10         # Faber: hold SPY while above its 10-month average
momentum_months = 12      # Antonacci: 12-month dual momentum
trend_weight = 0.5
momentum_weight = 0.5

[risk]
risk_per_trade = 0.01     # Max 1% of the account lost if a stop is hit
max_position = 0.25       # No single satellite position above 25% of the account
max_portfolio_heat = 0.06 # Total open stop-risk across positions
trailing_stop = 0.10      # Protective stop 10% under the highest close
max_drawdown = 0.15       # Circuit breaker: go to cash at -15% from peak
cost_bps = 5              # Assumed trading cost per dollar traded (0.05%)
rebalance_band = 0.05     # Only trade when off target by more than 5 points

# How much of the account may sit in stocks in each economic regime.
[regime.exposure_caps]
Expansion = 1.0
Recovery = 0.8
Late-cycle = 0.6
Contraction = 0.3

# ---------------------------------------------------------------------------
# Test beds. Three sleeves share one paper account; each keeps its own ledger,
# stops and circuit breaker. Capital moves between them only by the scorecard
# rules below, never by feel.

[sleeves.core]
capital = 15000
strategy = "core"          # The trend + momentum + regime system above

[sleeves.momentum]
capital = 5000
strategy = "momentum"      # Rules-based "hot stocks"

[sleeves.options]
capital = 5000
strategy = "options"       # Defined-risk credit spreads on SPY

[momentum]
holdings = 6               # Equal-weight the top N
lookback_months = 12       # Rank on 12-month return...
skip_months = 1            # ...excluding the most recent month (standard practice)
trailing_stop = 0.10
max_drawdown = 0.15
rebalance_band = 0.05
# Liquid U.S. large caps. Edit freely; the ranking does the picking.
universe = [
  "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "AVGO", "TSLA", "LLY",
  "JPM", "V", "MA", "UNH", "XOM", "COST", "HD", "PG", "JNJ", "ABBV",
  "NFLX", "CRM", "ORCL", "AMD", "BAC", "KO", "PEP", "MRK", "CVX", "WMT",
  "ADBE", "TMO", "CSCO", "ACN", "MCD", "ABT", "LIN", "GE", "CAT", "QCOM",
  "TXN", "AMGN", "ISRG", "INTU", "NOW", "GS", "BKNG", "UBER", "PANW", "ANET",
]

[options]
mode = "watch"             # "watch" logs the trade it would make; "trade" sends it
underlying = "SPY"
days_to_expiry_min = 30
days_to_expiry_max = 45
short_strike_pct_below = 0.06   # Short put about 6% under spot (rough stand-in for ~16 delta)
spread_width = 5                # Dollars between short and long strike
max_open_spreads = 3
max_risk_per_spread = 250       # Width x 100 minus credit must stay under this
take_profit = 0.50              # Buy back at 50% of the credit received
stop_multiple = 2.0             # Close if the spread costs 2x the credit to buy back

[scorecard]
review_every_days = 91          # Quarterly
promote_step = 0.25             # +25% capital after two straight winning reviews
demote_step = 0.25
max_experimental_share = 0.50   # No non-core sleeve above half the account

# ---------------------------------------------------------------------------
# Taxes. The paper account owes none; these assumptions make the system trade
# the way it would have to with real money and show the tax cost of every sell.
# Private repo: fill in your own situation here, not in chat. Confirm with a CPA.

[tax]
account_type = "taxable"   # "taxable", "ira" or "roth". IRA/Roth: no tax on individual trades.
filing_status = "mfj"      # "single", "mfj", "hoh" (used for labels only)
ordinary_rate = 0.24       # Federal bracket for short-term gains and interest (placeholder)
long_term_rate = 0.15      # Federal long-term capital gains rate (2026: 0% / 15% / 20%)
state_rate = 0.0           # State income tax on gains, if any
niit = false               # 3.8% Net Investment Income Tax above $200k single / $250k joint MAGI
lot_method = "hifo"        # Which shares to sell first: "hifo" (smallest gain) or "fifo" (oldest)
defer_for_long_term = true # Hold a routine rebalance sell if the lot turns long-term soon
defer_max_days = 45        # ...but only if long-term status is within this many days
defer_max_drift = 0.10     # ...and the position is no more than 10 points off target
